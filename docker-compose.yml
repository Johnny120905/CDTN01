# ==============================================================================
# File: docker-compose.yml
# Dự án: Hệ thống Smart CRM – Mekong Mobile (Luồng 05: Kho linh kiện thay thế)
# Mục đích: Điều phối kiến trúc đa dịch vụ (Ứng dụng Web/API + MongoDB 7.0)
# Tiêu chuẩn C1: Khởi dựng hoàn chỉnh hệ thống bằng <= 2 lệnh duy nhất
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DỊCH VỤ ỨNG DỤNG CHÍNH (FASTAPI BACKEND + SPA DARK 3D FRONTEND)
  # ----------------------------------------------------------------------------
  mekong-l5-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mekong_crm_l5_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/${DB_NAME:-mekong_mobile_l5}
      - DB_NAME=${DB_NAME:-mekong_mobile_l5}
      - DEFAULT_CENTER_ID=${DEFAULT_CENTER_ID:-L5-WH-890}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-mekong_mobile_secret_jwt_key_2026_cdtn01}
    volumes:
      - ./data:/app/data
      - ./seeds:/app/seeds
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mekong_l5_network

  # ----------------------------------------------------------------------------
  # 2. DỊCH VỤ CƠ SỞ DỮ LIỆU MONGODB 7.0 CỤC BỘ DỰ PHÒNG
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: mekong_crm_l5_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=mekong_mobile_l5
    volumes:
      - mongo_l5_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mekong_l5_network

volumes:
  mongo_l5_data:
    driver: local

networks:
  mekong_l5_network:
    driver: bridge
