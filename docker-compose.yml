# ==============================================================================
# File: docker-compose.yml
# Dự án: Hệ thống Smart CRM – Mekong Mobile (Luồng 05: Kho linh kiện thay thế)
# Mục đích: Điều phối kiến trúc đa dịch vụ (Ứng dụng Web/API + MongoDB 7.0)
# Hướng dẫn chạy:
#   - Khởi chạy toàn bộ hệ thống: docker compose up -d --build
#   - Chạy kiểm thử 43 test cases: docker compose exec mekong-l5-app pytest tests/ -v
#   - Dừng hệ thống:              docker compose down
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DỊCH VỤ ỨNG DỤNG CHÍNH (FASTAPI BACKEND + SPA DARK 3D FRONTEND)
  # ----------------------------------------------------------------------------
  mekong-l5-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mekong_crm_l5_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - DB_NAME=${DB_NAME:-mekong_mobile_l5}
      - DEFAULT_CENTER_ID=${DEFAULT_CENTER_ID:-L5-WH-890}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-mekong_mobile_secret_jwt_key_2026_cdtn01}
    volumes:
      # Đồng bộ dữ liệu người dùng và hạt giống 40 linh kiện bền vững trên máy chủ
      - ./data:/app/data
      - ./seeds:/app/seeds
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - mekong_l5_network

  # ----------------------------------------------------------------------------
  # 2. DỊCH VỤ CƠ SỞ DỮ LIỆU MONGODB CỤC BỘ DỰ PHÒNG (MONGODB 7.0)
  # (Hệ thống ưu tiên kết nối MongoDB Atlas trong .env, đồng thời sẵn sàng
  #  chuyển sang MongoDB Container cục bộ hoặc Dual-Persistence khi offline)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: mekong_crm_l5_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=mekong_mobile_l5
    volumes:
      - mongo_l5_data:/data/db
    networks:
      - mekong_l5_network

volumes:
  mongo_l5_data:
    driver: local

networks:
  mekong_l5_network:
    driver: bridge

